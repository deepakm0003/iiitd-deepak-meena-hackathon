# Models used by the NLP engine. All open-source; none produces the Impact Score (which is a formula).
# Resolved revisions are recorded in each signal's model_versions for reproducibility.
sentiment:
  name: ProsusAI/finbert            # BERT fine-tuned on Financial PhraseBank (never evaluate on PhraseBank)
  max_length: 128
  batch_size: 32
embedding:
  name: sentence-transformers/all-MiniLM-L6-v2   # 22M params; clustering, novelty, SetFit body
zero_shot:
  name: MoritzLaurer/deberta-v3-base-zeroshot-v2.0   # 184M params; fallback classifier for unseen classes
  hypothesis_template: "This financial news item is about {}."
# Trained weights too large for git (GitHub's 100 MB file limit), published as GitHub release assets.
# `python -m tripwire fetch-models` downloads them, checks the SHA-256 and unpacks them into models/.
release:
  sentiment_entity:
    url: https://github.com/deepakm0003/iiitd-deepak-meena-hackathon/releases/download/models-v1/sentiment_entity.zip
    sha256: PENDING
ner:
  name: urchade/gliner_multi-v2.1   # zero-shot NER, Apache 2.0
  labels: [company, bank, regulator, government agency, country, money amount, credit rating agency, financial instrument]
  threshold: 0.5
event_classifier:
  base: sentence-transformers/all-MiniLM-L6-v2   # SetFit body; trained artefact saved under models/event_setfit
  path: models/event_setfit
  # Selective classification (chosen on the validation split; docs/results/event_selective.json):
  # an ML label needs head probability >= min_confidence, else the item is Other ("abstain").
  # Kept at 0.30 on the in-domain gold dev split: 0.35 gained 0.04 precision on 44 items (noise).
  min_confidence: 0.30
  # Round 3 (5-fold CV on 478 human labels, docs/results/round3_experiment.json): the head over-predicted
  # Product Launch (70 predicted vs 46 true) and M&A (22 vs 13); a 0.5 bar for those two classes raised
  # accuracy 0.684 -> 0.726 and macro-F1 0.685 -> 0.710 with the shipped head, on both label subsets.
  min_confidence_by_class: {Product Launch: 0.5, Merger/Acquisition: 0.5}
  verify:                           # classes that also need the zero-shot NLI verifier to agree
    # The 6 stress-mappable classes (they drive Module B), plus Merger/Acquisition: its weak training labels
    # came from the Twitter topic "M&A | Investments", and on the gold dev split the head's M&A labels were
    # 0 of 6 correct (partnerships, fundraises, launches); the verifier rejects 5 of the 6.
    classes: [Credit Event, Geopolitical, Macroeconomic, Regulatory/Legal, Cyber/Operational,
              Natural Disaster/Supply Chain, Merger/Acquisition]
    # 0.10 -> 0.20 on the gold dev split (LLM silver labels): false-positive rate 0.57 -> 0.30, recall unchanged.
    min_p: 0.20
    # Stricter for the two classes that trigger capital stress tests. Human gold dev split: Credit Event false
    # positives 5 -> 2, Geopolitical 3 -> 1, no true positive lost (docs/results/weak_class_experiment.json).
    min_p_by_class: {Credit Event: 0.40, Geopolitical: 0.40}
