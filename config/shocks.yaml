# Severe-end shocks per event class (assumption A-15). Scaled by k(Impact) at run time.
# Part 5 replaces equity/spread levels with historical-analog measurements where available.
# Units: equity = fractional return, rates/spreads = basis points, pd = multiplier, vol = points.
assumption_id: A-15
classes:
  Geopolitical:
    layers: [systemic]
    systemic: { equity: -0.12, rate_10y_bp: -30, ig_spread_bp: 80, pd_mult: 1.5, vol_pts: 12 }
  Macroeconomic:
    layers: [systemic]
    systemic: { equity: -0.10, rate_10y_bp: 100, ig_spread_bp: 50, pd_mult: 1.3, vol_pts: 8 }
  Credit Event:
    layers: [entity, sector, systemic]
    entity: { equity: -0.40, spread_bp: 500, pd_mult: 5.0 }
    sector: { equity: -0.15, spread_bp: 200, pd_mult: 2.0 }
    systemic: { equity: -0.03, rate_10y_bp: -10, ig_spread_bp: 25, vol_pts: 5 }
  Regulatory/Legal:
    layers: [sector]
    sector: { equity: -0.12, spread_bp: 100, pd_mult: 1.5, vol_pts: 3 }
  Cyber/Operational:
    layers: [entity]
    entity: { equity: -0.15, spread_bp: 150, pd_mult: 1.5, vol_pts: 2 }
  Natural Disaster/Supply Chain:
    layers: [sector, geography]
    sector: { equity: -0.10, spread_bp: 60, pd_mult: 1.3, vol_pts: 3 }
    geography: { pd_mult: 1.8 }
